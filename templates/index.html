<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="utf-8">

<title>Parkplatzplanung</title>

<style>

body{
    font-family:Segoe UI,Arial,sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
}

h1{
    margin-bottom:30px;
}

.day{
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
    margin-bottom:10px;
}

.weekend{
    background:#f5f5f5;
}

.free{
    color:green;
}

.used{
    color:#b00020;
}

input{
    padding:8px;
}

button{
    padding:8px 12px;
    cursor:pointer;
}

</style>

</head>

<body>

<h1>Parkplatzplanung</h1>

<div id="container"></div>

<script>

function getToken(){

    let token =
        localStorage.getItem(
            "parking_token"
        );

    if(!token){

        token =
            crypto.randomUUID();

        localStorage.setItem(
            "parking_token",
            token
        );
    }

    return token;
}


async function load(){

    const response =
        await fetch(
            "/api/reservations"
        );

    const data =
        await response.json();

    render(data);
}


function formatDate(date){

    return date
        .toISOString()
        .split("T")[0];
}


function render(entries){

    const root =
        document.getElementById(
            "container"
        );

    root.innerHTML = "";

    for(let i=0;i<90;i++){

        const d = new Date();

        d.setDate(
            d.getDate()+i
        );

        const key =
            formatDate(d);

        const entry =
            entries[key];

        const div =
            document.createElement(
                "div"
            );

        div.className = "day";

        if(
            d.getDay()===0 ||
            d.getDay()===6
        ){
            div.classList.add(
                "weekend"
            );
        }

        const title =
            d.toLocaleDateString(
                "de-DE",
                {
                    weekday:"long",
                    day:"2-digit",
                    month:"2-digit",
                    year:"numeric"
                }
            );

        if(!entry){

            div.innerHTML = `
                <b>${title}</b>
                <br>
                <span class="free">
                    Frei
                </span>
                <br><br>

                <input
                    id="i-${key}"
                    placeholder="Name">

                <button
                    onclick="reserve('${key}')">
                    Reservieren
                </button>
            `;

        }else{

            const mine =
                entry.token ===
                getToken();

            div.innerHTML = `
                <b>${title}</b>
                <br>

                <span class="used">
                    Reserviert von
                    <b>${entry.name}</b>
                </span>

                <br><br>

                ${
                    mine
                    ?
                    `<button onclick="removeEntry('${key}')">
                        Löschen
                    </button>`
                    :
                    ""
                }
            `;
        }

        root.appendChild(div);
    }
}


async function reserve(day){

    const name =
        document
        .getElementById(
            `i-${day}`
        )
        .value
        .trim();

    if(!name){

        alert(
            "Bitte Namen eingeben"
        );

        return;
    }

    const response =
        await fetch(
            "/api/reserve",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({

                    day:day,
                    name:name,
                    token:getToken()

                })
            }
        );

    if(!response.ok){

        alert(
            "Der Tag ist bereits reserviert."
        );
    }

    load();
}


async function removeEntry(day){

    await fetch(
        "/api/delete",
        {

            method:"POST",

            headers:{
                "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

                day:day,
                token:getToken()

            })
        }
    );

    load();
}


load();

</script>

</body>
</html>
